
name: Salesforce 2GP Package - Manual Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-and-install-package:
    name: Create and Install 2GP Package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    environment: QA

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --------------------------------------------------
      # 3. Install Salesforce CLI
      # --------------------------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      # --------------------------------------------------
      # 4. Verify Salesforce project
      # --------------------------------------------------
      - name: Verify Salesforce Project
        run: |
          if [ ! -f "sfdx-project.json" ]; then
            echo "ERROR: sfdx-project.json not found."
            exit 1
          fi

          echo "Salesforce project found."

          if [ ! -d "force-app" ]; then
            echo "ERROR: force-app directory not found."
            exit 1
          fi

          echo "Source directory found."

      # --------------------------------------------------
      # 5. Configure JWT private key
      # --------------------------------------------------
      - name: Configure JWT Key
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/salesforce"

          printf '%s\n' "$SF_JWT_KEY" \
            > "$RUNNER_TEMP/salesforce/server.key"

          chmod 600 "$RUNNER_TEMP/salesforce/server.key"

          openssl pkey \
            -in "$RUNNER_TEMP/salesforce/server.key" \
            -noout

          echo "JWT private key validated."

      # --------------------------------------------------
      # 6. Authenticate to Dev Hub
      # --------------------------------------------------
      - name: Authenticate Dev Hub
        env:
          SF_CLIENT_ID: ${{ secrets.SF_DEVHUB_CLIENT_ID }}
          SF_USERNAME: ${{ vars.SF_USERNAME }}
          SF_DEVHUB_LOGIN_URL : ${{ vars.SF_DEVHUB_LOGIN_URL  }}
        run: |
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/salesforce/server.key" \
            --username "$SF_USERNAME" \
            --instance-url "$SF_DEVHUB_LOGIN_URL " \
            --alias devhub \
            --set-default-dev-hub

      # --------------------------------------------------
      # 7. Verify Dev Hub authentication
      # --------------------------------------------------
      - name: Verify Dev Hub Authentication
        run: |
          sf org display --target-org devhub

      # --------------------------------------------------
      # 8. Validate package alias
      # --------------------------------------------------
      - name: Validate Package Configuration
        env:
          PACKAGE_ALIAS: ${{ vars.SF_PACKAGE_ALIAS }}
        run: |
          if [ -z "$PACKAGE_ALIAS" ]; then
            echo "ERROR: SF_PACKAGE_ALIAS is not configured."
            exit 1
          fi

          echo "Package alias configured."

      # --------------------------------------------------
      # 9. Create 2GP package version
      # --------------------------------------------------
      - name: Create 2GP Package Version
        env:
          PACKAGE_ALIAS: ${{ vars.SF_PACKAGE_ALIAS }}
        run: |
          sf package version create \
            --package "$PACKAGE_ALIAS" \
            --target-dev-hub devhub \
            --installation-key-bypass \
            --wait 60 \
            --json > "$RUNNER_TEMP/package-version-result.json"

          PACKAGE_VERSION_ID=$(jq -r \
            '.result.SubscriberPackageVersionId // empty' \
            "$RUNNER_TEMP/package-version-result.json")

          if [ -z "$PACKAGE_VERSION_ID" ]; then
            echo "ERROR: Package version creation failed."
            jq . "$RUNNER_TEMP/package-version-result.json"
            exit 1
          fi

          echo "PACKAGE_VERSION_ID=$PACKAGE_VERSION_ID" >> "$GITHUB_ENV"

          echo "Package version created successfully."
          echo "Subscriber Package Version ID: $PACKAGE_VERSION_ID"

      # --------------------------------------------------
      # 10. Install package into same Dev Hub org
      # --------------------------------------------------
      - name: Install Package
        run: |
          sf package install \
            --package "$PACKAGE_VERSION_ID" \
            --target-org devhub \
            --wait 60 \
            --publish-wait 10 \
            --security-type AdminsOnly \
            --no-prompt

      # --------------------------------------------------
      # 11. Verify package installation
      # --------------------------------------------------
      - name: Verify Package Installation
        run: |
          sf package installed list \
            --target-org devhub

      # --------------------------------------------------
      # 12. Cleanup private key
      # --------------------------------------------------
      - name: Cleanup JWT Key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/salesforce/server.key"

