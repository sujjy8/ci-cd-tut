
name: Salesforce 2GP Package - Manual Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-and-install-package:
    name: Create and Install 2GP Package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    environment: QA

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --------------------------------------------------
      # 3. Install Salesforce CLI
      # --------------------------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      # --------------------------------------------------
      # 4. Verify Salesforce project
      # --------------------------------------------------
      - name: Verify Salesforce Project
        run: |
          if [ ! -f "sfdx-project.json" ]; then
            echo "ERROR: sfdx-project.json not found."
            exit 1
          fi

          if [ ! -d "force-app" ]; then
            echo "ERROR: force-app directory not found."
            exit 1
          fi

          echo "Salesforce project validated."

      # --------------------------------------------------
      # 5. Configure JWT private key
      # --------------------------------------------------
      - name: Configure JWT Key
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/salesforce"

          printf '%s\n' "$SF_JWT_KEY" \
            > "$RUNNER_TEMP/salesforce/server.key"

          chmod 600 "$RUNNER_TEMP/salesforce/server.key"

          openssl pkey \
            -in "$RUNNER_TEMP/salesforce/server.key" \
            -noout

          echo "JWT private key validated."

      # --------------------------------------------------
      # 6. Authenticate to Dev Hub
      # --------------------------------------------------
      - name: Authenticate Dev Hub
        env:
          SF_CLIENT_ID: ${{ secrets.SF_DEVHUB_CLIENT_ID }}
          SF_USERNAME: ${{ vars.SF_USERNAME }}
          SF_DEVHUB_LOGIN_URL: ${{ vars.SF_DEVHUB_LOGIN_URL }}
        run: |
          if [ -z "$SF_CLIENT_ID" ]; then
            echo "ERROR: SF_DEVHUB_CLIENT_ID is empty."
            exit 1
          fi

          if [ -z "$SF_USERNAME" ]; then
            echo "ERROR: SF_USERNAME is empty."
            exit 1
          fi

          if [ -z "$SF_DEVHUB_LOGIN_URL" ]; then
            echo "ERROR: SF_DEVHUB_LOGIN_URL is empty."
            exit 1
          fi

          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/salesforce/server.key" \
            --username "$SF_USERNAME" \
            --instance-url "$SF_DEVHUB_LOGIN_URL" \
            --alias devhub \
            --set-default-dev-hub

      # --------------------------------------------------
      # 7. Verify Dev Hub authentication
      # --------------------------------------------------
      - name: Verify Dev Hub Authentication
        run: |
          sf org display --target-org devhub

      # --------------------------------------------------
      # 8. Create package if it does not exist
      # --------------------------------------------------
      - name: Create Unlocked Package
        run: |
          PACKAGE_ID=$(jq -r \
            '.packageAliases.CustomMetadataPackage // empty' \
            sfdx-project.json)

          if [ -z "$PACKAGE_ID" ]; then

            echo "Package not found in sfdx-project.json."
            echo "Creating unlocked package..."

            sf package create \
              --name "Custom Metadata Package" \
              --package-type Unlocked \
              --path force-app \
              --target-dev-hub devhub \
              --json > "$RUNNER_TEMP/create-package.json" 2>&1

            COMMAND_STATUS=$?

            if [ "$COMMAND_STATUS" -ne 0 ]; then
              echo "ERROR: Package creation failed."
              cat "$RUNNER_TEMP/create-package.json"
              exit 1
            fi

            PACKAGE_ID=$(jq -r \
              '.result.Id // empty' \
              "$RUNNER_TEMP/create-package.json")

            if [ -z "$PACKAGE_ID" ]; then
              echo "ERROR: Package ID not found."
              cat "$RUNNER_TEMP/create-package.json"
              exit 1
            fi

            echo "Package created successfully."

            jq --arg id "$PACKAGE_ID" \
              '.packageAliases.CustomMetadataPackage = $id' \
              sfdx-project.json \
              > "$RUNNER_TEMP/sfdx-project.json"

            mv "$RUNNER_TEMP/sfdx-project.json" sfdx-project.json

          else
            echo "Existing package found."
          fi

          echo "PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"

          echo "Package ID: $PACKAGE_ID"

      # --------------------------------------------------
      # 9. Create 2GP package version
      # --------------------------------------------------
      - name: Create 2GP Package Version
        run: |
          set +e

          echo "Creating package version for:"
          echo "Package ID: $PACKAGE_ID"

          sf package version create \
            --package "$PACKAGE_ID" \
            --target-dev-hub devhub \
            --installation-key-bypass \
            --wait 60 \
            --json > "$RUNNER_TEMP/package-version-result.json" 2>&1

          COMMAND_STATUS=$?

          echo "=========================================="
          echo "Salesforce CLI Package Version Output"
          echo "=========================================="

          cat "$RUNNER_TEMP/package-version-result.json"

          echo "=========================================="

          if [ "$COMMAND_STATUS" -ne 0 ]; then
            echo "ERROR: Package version creation failed."
            echo "Exit code: $COMMAND_STATUS"
            exit 1
          fi

          PACKAGE_VERSION_ID=$(jq -r \
            '.result.SubscriberPackageVersionId // empty' \
            "$RUNNER_TEMP/package-version-result.json")

          if [ -z "$PACKAGE_VERSION_ID" ]; then
            echo "ERROR: Subscriber Package Version ID not found."
            exit 1
          fi

          echo "PACKAGE_VERSION_ID=$PACKAGE_VERSION_ID" >> "$GITHUB_ENV"

          echo "Package version created successfully."
          echo "Subscriber Package Version ID: $PACKAGE_VERSION_ID"

      # --------------------------------------------------
      # 10. Install package into Dev Hub org
      # --------------------------------------------------
      - name: Install Package
        run: |
          sf package install \
            --package "$PACKAGE_VERSION_ID" \
            --target-org devhub \
            --wait 60 \
            --publish-wait 10 \
            --security-type AdminsOnly \
            --no-prompt

      # --------------------------------------------------
      # 11. Verify package installation
      # --------------------------------------------------
      - name: Verify Package Installation
        run: |
          sf package installed list \
            --target-org devhub

      # --------------------------------------------------
      # 12. Cleanup private key
      # --------------------------------------------------
      - name: Cleanup JWT Key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/salesforce/server.key"
