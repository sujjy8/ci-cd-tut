
name: Salesforce QA Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-to-qa:
    name: Deploy force-app to Salesforce QA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment: QA

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Salesforce CLI
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      # 3. Configure raw JWT private key
      - name: Configure JWT Key
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/salesforce"

          printf '%s\n' "$SF_JWT_KEY" \
            > "$RUNNER_TEMP/salesforce/server.key"

          chmod 600 "$RUNNER_TEMP/salesforce/server.key"

          openssl pkey \
            -in "$RUNNER_TEMP/salesforce/server.key" \
            -noout

      # 4. Authenticate Salesforce QA
      - name: Authenticate Salesforce QA
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ vars.SF_USERNAME }}
          SF_LOGIN_URL: ${{ vars.SF_LOGIN_URL }}
        run: |
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/salesforce/server.key" \
            --username "$SF_USERNAME" \
            --instance-url "$SF_LOGIN_URL" \
            --alias qa-org

      # 5. Display authenticated org information
      - name: Verify Salesforce Authentication
        run: |
          sf org display \
            --target-org qa-org 

      # 6. Deploy force-app to QA
      - name: Deploy force-app to QA
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org qa-org \
            --wait 60

      # 7. Cleanup private key
      - name: Cleanup JWT Key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/salesforce/server.key"
